spring:
  application:
    name: java-observability-lab
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/observability}
    username: ${DB_USER:observability}
    password: ${DB_PASSWORD:observability}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 2000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,threaddump,heapdump
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [requestId=%X{requestId:-}] %logger{40} - %msg%n"
  level:
    root: INFO
    com.example.observability: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
